<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SalesCRM — نموذج أولي</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b2430;--mut:#6b7684;--pri:#1d6fb8;--bd:#dde1e6;--ok:#1e8e4e;--warn:#c27a00;--err:#c8372d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--card:#1b2128;--tx:#e8ecf0;--mut:#93a0ae;--pri:#5aa6e8;--bd:#2d3640;--ok:#4cc27f;--warn:#e5a63a;--err:#ef6a60;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161b;--card:#1b2128;--tx:#e8ecf0;--mut:#93a0ae;--pri:#5aa6e8;--bd:#2d3640;--ok:#4cc27f;--warn:#e5a63a;--err:#ef6a60;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,"Segoe UI",Tahoma,Arial,sans-serif}
header{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header b{color:var(--pri)}nav{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap;background:none;border:0;padding:6px 12px;border-radius:16px;color:var(--mut);cursor:pointer;font:inherit}
nav button.on{background:var(--pri);color:#fff}
main{padding:14px;max-width:1000px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
h2,h3{margin:0 0 10px}h3{font-size:16px}
button.b,.b{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
.b.s{background:none;color:var(--pri);border:1px solid var(--pri)}.b.r{background:var(--err)}
input,select,textarea{width:100%;padding:7px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th{color:var(--mut);font-weight:600}
.tg{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;color:#fff}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.map{position:relative;height:340px;border-radius:10px;border:1px solid var(--bd);background:linear-gradient(var(--bd) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,var(--bd) 1px,transparent 1px) 0 0/40px 40px,var(--bg)}
.pin{position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid #fff;cursor:pointer;transform:translate(-50%,-50%)}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.md{background:var(--card);border-radius:12px;padding:16px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal div{padding:6px 2px;border:1px solid var(--bd);border-radius:6px;min-height:46px;cursor:pointer;font-size:13px}
.cal .h{border:0;min-height:0;color:var(--mut);cursor:default}.cal .on{outline:2px solid var(--pri)}.cal .t{color:var(--pri);font-size:11px}
.tot{font-weight:700;text-align:left}.mut{color:var(--mut)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const ST={C:['حالي','var(--ok)'],P:['محتمل','var(--warn)'],F:['سابق','var(--mut)']};
const C=[[1,'محل الأمل','0795555555','ماركا، عمّان','C','بدأ التعامل معنا',64.5,62,40],[2,'بقالة النور','0781112233','الزرقاء','C','بدأ التعامل معنا',-20,30,70],[3,'مخبز السلام','0777654321','إربد','P','تم تسليم عينات',0,75,18],[4,'سوبرماركت الخير','0799887766','صويلح، عمّان','P','يطلب سعرًا أفضل',0,48,55],[5,'مطعم الشام','0788001122','العقبة','F','لم تنجح فرصة البيع',350.25,20,25],[6,'محل الندى','0791234567','مادبا','P','لم يتم التواصل بعد',0,85,78]];
const PR=[73,75,95,112,116,127,148].map((s,i)=>['CTN-'+s,'كرتون '+s,'حبة',+(1.25+i*.15).toFixed(3)]).concat([['ROLL-GEN','رولات قصدير','كيلو',2.1]]);
const E=[['مدير النظام','admin@example.com','أدمن','فعال'],['سامر الخطيب','samer@example.com','مندوب','فعال'],['ليث حداد','laith@example.com','مندوب','معطل']];
const TK=[['تحصيل شيك محل الأمل','سامر','محل الأمل',6,'10:00','قيد التنفيذ','أدمن'],['زيارة مخبز السلام','سامر','مخبز السلام',8,'11:30','معلقة','أدمن'],['تسليم عينات للخير','سامر','سوبرماركت الخير',12,'','معلقة','سامر'],['عرض سعر مطعم الشام','ليث','مطعم الشام',15,'09:00','معلقة','أدمن'],['اجتماع شهري','سامر','',20,'14:00','معلقة','أدمن'],['متابعة بقالة النور','سامر','بقالة النور',3,'','مكتملة','أدمن']];
const RP=[['2026-11-08','سامر','محل الأمل','زيارة','تسليم عينات، العميل راضٍ عن الجودة','متابعة بعد أسبوع'],['2026-11-07','سامر','بقالة النور','اتصال','طلب كمية إضافية','تجهيز فاتورة'],['2026-11-07','ليث','مطعم الشام','زيارة','يرى السعر مرتفعًا','عرض سعر جديد']];
const IV=[['INV-000014','محل الأمل','2026-11-05','سامر','14.500','مؤكدة'],['INV-000013','بقالة النور','2026-11-03','سامر','116.000','مؤكدة'],['INV-000012','مطعم الشام','2026-10-28','ليث','58.000','ملغاة']];
const PY=[['محل الأمل','2026-11-06','كاش','50.000','سامر','محصّلة'],['بقالة النور','2026-11-07','شيك','80.000','ليث','بانتظار التحصيل'],['مطعم الشام','2026-10-30','شيك','40.000','ليث','مرتجع']];
let role='admin',page='login',cur=1,day=8,tab='iv';
const fmt=b=>b>0?b.toFixed(3)+' عليه':b<0?(-b).toFixed(3)+' له':'مسدد';
const tag=(t,c)=>`<span class="tg" style="background:${c}">${t}</span>`;
const stTag=s=>tag(ST[s][0],ST[s][1]);
const T=(h,r)=>`<div class="w"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</table></div>`;
const opt=a=>a.map(x=>`<option>${x}</option>`).join('');
const cn=()=>C.map(c=>c[1]);
const go=(p,id)=>{page=p;if(id)cur=id;render()};
const cust=id=>C.find(c=>c[0]==id);
function modal(t,h){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="md"><h3>${t}</h3>${h}<div class="row" style="margin-top:14px"><button class="b" onclick="this.closest('.ov').remove()">حفظ (تجريبي)</button><button class="b s" onclick="this.closest('.ov').remove()">إغلاق</button></div></div>`;document.body.append(o)}
const NAV={admin:[['map','الخريطة'],['list','العملاء'],['fin','الفواتير والدفعات'],['rview','التقارير'],['tasks','إدارة المهام'],['prods','المنتجات والأسعار'],['emps','الموظفون']],rep:[['map','الخريطة'],['list','العملاء'],['reports','تقاريري'],['cal','تقويمي ومهامي']]};
function render(){
 if(page==='login'){$('#app').innerHTML=`<main><div class="card" style="max-width:380px;margin:60px auto"><h2>SalesCRM <small class="mut">نظام المبيعات</small></h2><label>البريد الإلكتروني</label><input value="samer@example.com"><label>كلمة المرور</label><input type="password" value="12345678"><div class="row" style="margin-top:12px"><button class="b" onclick="role='rep';go('map')">دخول كمندوب</button><button class="b s" onclick="role='admin';go('map')">دخول كأدمن</button></div><p class="mut" style="font-size:13px">الحسابات المعطلة تُرفض. لا يوجد تسجيل عام.</p></div></main>`;return}
 const n=NAV[role];if(!n.some(x=>x[0]===page)&&!['detail'].includes(page))page='map';
 $('#app').innerHTML=`<header><span><b>SalesCRM</b> — ${role==='admin'?'الأدمن':'المندوب (سامر)'}</span><span class="row"><button class="b ${role==='admin'?'':'s'}" onclick="sw('admin')">أدمن</button><button class="b ${role==='rep'?'':'s'}" onclick="sw('rep')">مندوب</button><button class="b s" onclick="go('login')">خروج</button></span></header><nav>${n.map(x=>`<button class="${page===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</nav><main>${P[page]()}</main>`}
const P={
map(){return`<h2>خريطة العملاء</h2><div class="row" style="margin-bottom:8px">${Object.keys(ST).map(k=>stTag(k)).join(' ')}</div><div class="map">${C.map(c=>`<span class="pin" title="${c[1]}" style="left:${c[7]}%;top:${c[8]}%;background:${ST[c[4]][1]}" onclick="pinInfo(${c[0]})"></span>`).join('')}</div><div id="pi" class="card" style="margin-top:12px">اضغط على علامة لعرض ملخص العميل.</div><p class="mut">عميل بدون موقع: لا يظهر هنا لكنه متاح في القائمة.</p>`},
list(){return`<div class="row" style="justify-content:space-between"><h2>العملاء</h2><button class="b" onclick="cform()">+ عميل</button></div><input placeholder="بحث..." oninput="fl(this)" style="margin-bottom:10px"><div class="card"><div class="w"><table id="lt"><thead><tr><th>العميل</th><th>المنتجات والأسعار</th><th>الذمة</th><th>الحالة</th><th></th></tr></thead><tbody>${C.map(c=>`<tr><td><b>${c[1]}</b><br><small class="mut">${c[3]}</small></td><td>${c[4]==='P'?'<span class="mut">—</span>':'كرتون 73: 1.250 +2'}</td><td>${fmt(c[6])}</td><td>${stTag(c[4])}</td><td class="row"><button class="b s" onclick="go('detail',${c[0]})">تفاصيل</button><button class="b" onclick="inv(${c[0]})">فاتورة</button><button class="b s" onclick="pay(${c[0]})">دفعة</button></td></tr>`).join('')}</tbody></table></div></div>`},
detail(){const c=cust(cur);return`<div class="row" style="justify-content:space-between"><h2>${c[1]} ${stTag(c[4])}</h2><span class="row"><button class="b s" onclick="go('list')">رجوع</button><button class="b s" onclick="cform(${c[0]})">تعديل</button><button class="b" onclick="inv(${c[0]})">فاتورة</button><button class="b s" onclick="pay(${c[0]})">دفعة</button></span></div>
<div class="g2"><div class="card"><h3>البيانات</h3>الهاتف: ${c[2]}<br>العنوان: ${c[3]}<br>الموقع: 31.98, 35.99<br>المرحلة: <b>${c[5]}</b><br>الرصيد: <b>${fmt(c[6])}</b></div><div class="card"><h3>الأسعار المتفقة</h3>${T(['المنتج','السعر'],[['كرتون 73','1.250'],['كرتون 95','1.550'],['رولات','2.100']])}</div></div>
<div class="card"><h3>منتجات موردين آخرين</h3>${T(['المنتج','المورد','سعر الشراء','ملاحظة'],[['رولات 30سم','شركة الفجر','2.300','جودة متوسطة']])}</div>
<div class="card"><h3>كشف الحساب</h3>${T(['التاريخ','البيان','عليه','له','الرصيد'],[['2026-01-01','رصيد افتتاحي','100.000','','100.000'],['2026-11-05','فاتورة INV-000014','14.500','','114.500'],['2026-11-06','دفعة - كاش','','50.000','64.500']])}</div>
<div class="card"><h3>المتابعات السابقة</h3>${T(['التاريخ','الموظف','النشاط','النتيجة','الخطوة القادمة'],RP.slice(0,1).map(r=>[r[0],r[1],r[3],r[4],r[5]]))}</div>
<div class="card"><h3>المهام المرتبطة</h3>${T(['المهمة','اليوم','الحالة'],[['تحصيل شيك','6 نوفمبر','قيد التنفيذ']])}</div>`},
reports(){return`<h2>تقاريري</h2><div class="card"><h3>تقرير جديد</h3><div class="g2"><div><label>تاريخ التقرير</label><input type="date" value="2026-11-08"></div><div><label>ملاحظات عامة</label><input placeholder="..."></div></div><h3 style="margin-top:12px">المتابعات</h3><div class="g2"><div><label>العميل</label><select>${opt(cn())}</select></div><div><label>النشاط</label><select>${opt(['زيارة','اتصال','تسليم عينات','عرض سعر','أخرى'])}</select></div></div><label>ما الذي حصل</label><textarea rows="2"></textarea><label>النتيجة</label><input><label>الخطوة القادمة</label><input><div class="row" style="margin-top:10px"><button class="b s">+ متابعة أخرى</button><button class="b" onclick="alert('تم الإرسال (تجريبي)')">إرسال التقرير</button></div></div><div class="card"><h3>تقاريري السابقة</h3>${T(['التاريخ','العميل','النشاط','الشرح'],RP.slice(0,2).map(r=>[r[0],r[2],r[3],r[4]]))}</div>`},
cal(){const L=TK.filter(t=>t[1]==='سامر'),d=L.filter(t=>t[3]==day);let g=['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'].map(x=>`<div class="h">${x}</div>`).join('');for(let i=1;i<=30;i++){const k=L.filter(t=>t[3]==i).length;g+=`<div class="${i==day?'on':''}" onclick="day=${i};render()">${i}${k?`<br><span class="t">${k} مهام</span>`:''}</div>`}
return`<div class="row" style="justify-content:space-between"><h2>تقويمي — نوفمبر 2026</h2><button class="b" onclick="tform(1)">+ مهمة لنفسي</button></div><div class="card"><div class="cal">${g}</div></div><div class="card"><h3>مهام يوم ${day}</h3>${d.length?d.map(t=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--bd);padding:6px 0"><span><b>${t[0]}</b><br><small class="mut">${t[2]||'بدون عميل'} · ${t[4]||'بدون ساعة'} · أنشأها: ${t[6]}</small></span><button class="b s" onclick="upd()">تحديث</button></div>`).join(''):'<span class="mut">لا مهام</span>'}</div>`},
rview(){return`<h2>تقارير الموظفين</h2><div class="card"><div class="g2"><div><label>الموظف</label><select>${opt(['الكل','سامر','ليث'])}</select></div><div><label>التاريخ</label><input type="date"></div><div><label>العميل</label><select>${opt(['الكل',...cn()])}</select></div></div></div><div class="card">${T(['التاريخ','الموظف','العميل','النشاط','الشرح','الخطوة القادمة'],RP)}</div>`},
tasks(){const st=s=>tag(s,s==='مكتملة'?'var(--ok)':s==='ملغاة'?'var(--mut)':'var(--pri)');return`<div class="row" style="justify-content:space-between"><h2>إدارة المهام</h2><button class="b" onclick="tform()">+ مهمة</button></div><div class="card"><div class="g2"><div><label>الموظف</label><select>${opt(['الكل','سامر','ليث'])}</select></div><div><label>الحالة</label><select>${opt(['الكل','معلقة','قيد التنفيذ','مكتملة','ملغاة'])}</select></div></div></div><div class="card">${T(['المهمة','الموظف','العميل','اليوم','الحالة','',''],TK.map(t=>[t[0],t[1],t[2]||'—',t[3]+' نوفمبر',st(t[5])+(t[3]<8&&!['مكتملة','ملغاة'].includes(t[5])?' '+tag('متأخرة','var(--err)'):''),'<button class="b s" onclick="tform()">تعديل / إعادة إسناد</button>','<button class="b r" onclick="alert(\'إلغاء (تجريبي)\')">إلغاء</button>']))}</div>`},
prods(){return`<h2>المنتجات والأسعار</h2><div class="card"><div class="row" style="justify-content:space-between"><h3>المنتجات</h3><button class="b" onclick="modal('منتج جديد','<label>الكود</label><input><label>الاسم</label><input><label>النوع</label><select><option>كرتون (بالعدد)</option><option>رولات (بالكيلو)</option></select>')">+ منتج</button></div>${T(['الكود','الاسم','الوحدة','فعال'],PR.map(p=>[p[0],p[1],p[2],'✓']))}</div><div class="card"><h3>سعر عميل محدد</h3><select onchange="">${opt(cn())}</select>${T(['المنتج','السعر المتفق','تعديل'],PR.slice(0,3).map(p=>[p[1],p[3].toFixed(3),'<button class="b s" onclick="alert(\'يُسجل في سجل التدقيق\')">تعديل</button>']))}</div>`},
emps(){return`<div class="row" style="justify-content:space-between"><h2>الموظفون</h2><button class="b" onclick="modal('موظف جديد','<label>الاسم</label><input><label>الهاتف</label><input><label>البريد</label><input><label>كلمة المرور المؤقتة</label><input type=password><label><input type=checkbox style=width:auto> أدمن</label>')">+ موظف</button></div><div class="card">${T(['الاسم','البريد','الدور','الحساب',''],E.map(e=>[...e.slice(0,3),tag(e[3],e[3]==='فعال'?'var(--ok)':'var(--err)'),'<button class="b s" onclick="alert(\'تعديل / تعطيل (تجريبي)\')">تعديل / تعطيل</button>']))}</div>`},
fin(){const a=tab==='iv';return`<h2>الفواتير والدفعات</h2><div class="row" style="margin-bottom:10px"><button class="b ${a?'':'s'}" onclick="tab='iv';render()">الفواتير</button><button class="b ${a?'s':''}" onclick="tab='py';render()">الدفعات</button></div><div class="card">${a?T(['الرقم','العميل','التاريخ','الموظف','الإجمالي','الحالة',''],IV.map(r=>[...r.slice(0,5),tag(r[5],r[5]==='مؤكدة'?'var(--ok)':'var(--mut)'),r[5]==='مؤكدة'?'<button class="b r" onclick="modal(\'إلغاء فاتورة\',\'<label>سبب الإلغاء</label><textarea></textarea><p class=mut>بعدها تُصدر فاتورة بديلة.</p>\')">إلغاء موثق</button>':''])):T(['العميل','التاريخ','الطريقة','المبلغ','الموظف','الحالة'],PY.map(r=>[...r.slice(0,5),tag(r[5],r[5]==='محصّلة'?'var(--ok)':r[5]==='مرتجع'?'var(--err)':'var(--warn)')]))}</div><div class="card"><h3>ذمم العملاء</h3>${T(['العميل','الرصيد'],C.map(c=>[c[1],fmt(c[6])]))}</div>`}};
function sw(r){role=r;page=r==='rep'?'reports':'map';render()}
function fl(i){document.querySelectorAll('#lt tbody tr').forEach(r=>r.hidden=!r.textContent.includes(i.value))}
function pinInfo(id){const c=cust(id);$('#pi').innerHTML=`<b>${c[1]}</b> ${stTag(c[4])}<br>${c[3]} · ${c[2]}<br>الذمة: ${fmt(c[6])}<br><button class="b" style="margin-top:8px" onclick="go('detail',${id})">فتح التفاصيل</button>`}
function cform(id){const c=id?cust(id):['','','','','P',''];modal(id?'تعديل عميل':'عميل جديد',`<label>الاسم</label><input value="${c[1]}"><label>الهاتف</label><input value="${c[2]}"><label>العنوان</label><input value="${c[3]}"><label>خط العرض / الطول</label><div class="row"><input placeholder="31.98" style="flex:1"><input placeholder="35.99" style="flex:1"></div><label>حالة العلاقة</label><select>${opt(['حالي','محتمل','سابق'])}</select><label>المرحلة</label><select>${opt(['لم يتم التواصل بعد','تم التواصل','تم تقديم عرض سعر','تم تسليم عينات','بانتظار نتيجة التجربة','يطلب سعرًا أفضل','توجد مشكلة في المنتج','بدأ التعامل معنا','لم تنجح فرصة البيع'])}</select><label>الرصيد الافتتاحي وتاريخه</label><div class="row"><input value="0.000" style="flex:1"><input type="date" style="flex:1"></div>`)}
function inv(id){const c=cust(id);modal('فاتورة — '+c[1],`<label>تاريخ الفاتورة</label><input type="date" value="2026-11-08">${[0,1,2].map(i=>`<div class="row" style="margin-top:8px"><select class="ip" style="flex:2" onchange="calc()"><option value="0">— منتج —</option>${PR.map(p=>`<option value="${p[3]}">${p[1]} (${p[3].toFixed(3)})</option>`).join('')}</select><input class="iq" type="number" step="0.5" min="0" placeholder="الكمية" style="flex:1" oninput="calc()"></div>`).join('')}<div class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between"><span>المجموع</span><b id="s1">0.000</b></div><div class="row" style="justify-content:space-between"><span>الضريبة 16%</span><b id="s2">0.000</b></div><div class="row" style="justify-content:space-between"><span>الإجمالي</span><b id="s3">0.000</b></div></div><p class="mut" style="font-size:12px">السعر يُجلب من اتفاق العميل، والحساب النهائي يتم في الـBackend.</p>`)}
function calc(){const p=[...document.querySelectorAll('.ip')],q=[...document.querySelectorAll('.iq')];let s=0;p.forEach((x,i)=>s+=+x.value*(+q[i].value||0));s=Math.round(s*1000)/1000;const t=Math.round(s*160)/1000;$('#s1').textContent=s.toFixed(3);$('#s2').textContent=t.toFixed(3);$('#s3').textContent=(s+t).toFixed(3)}
function pay(id){const c=cust(id);modal('دفعة — '+c[1],`<label>المبلغ (JOD)</label><input type="number" step="0.001"><label>تاريخ الدفع</label><input type="date" value="2026-11-08"><label>الطريقة</label><select onchange="document.getElementById('ch').hidden=this.value!=='شيك'">${opt(['كاش','كليك','تحويل بنكي','شيك'])}</select><div id="ch" hidden><label>رقم الشيك</label><input><label>البنك</label><input><label>تاريخ الاستحقاق</label><input type="date"></div><label>رقم المرجع</label><input><label>ملاحظات</label><input>`)}
function tform(self){modal('مهمة / موعد',`<label>العنوان</label><input><label>الوصف</label><textarea rows="2"></textarea>${self?'':`<label>الموظف</label><select>${opt(['سامر','ليث'])}</select>`}<label>العميل (اختياري)</label><select><option>—</option>${opt(cn())}</select><div class="row"><div style="flex:1"><label>اليوم</label><input type="date"></div><div style="flex:1"><label>الساعة</label><input type="time"></div></div><label>تذكير (اختياري)</label><input type="datetime-local">`)}
function upd(){modal('تحديث المهمة',`<label>الحالة</label><select>${opt(['معلقة','قيد التنفيذ','مكتملة'])}</select><label>ملاحظات التنفيذ</label><textarea rows="3"></textarea>`)}
render();
</script>
</body>
</html>
